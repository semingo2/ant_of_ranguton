<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラングトンのアリ 2匹実験</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        margin-top: 0;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 15px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
        background: #222;
        color: white;
    }

    button:hover {
        opacity: 0.8;
    }

    .info {
        background: white;
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    #canvasWrapper {
        width: 100%;
        height: 650px;
        background: white;
        border-radius: 10px;
        overflow: auto;
        border: 1px solid #ccc;
    }

    canvas {
        display: block;
    }

    .direction-buttons {
        display: flex;
        gap: 5px;
    }

    .active {
        background: #555;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🐜 ラングトンのアリ 2匹実験</h1>

    <div class="controls">

        <button id="stepButton">
            1ステップ進む
        </button>

        <button id="startButton">
            ▶ 自動再生
        </button>

        <button id="speedButton">
            ⚡ 速くする
        </button>

        <button id="resetButton">
            ↻ リセット
        </button>

        <button id="nextButton">
            次へ →（間隔を増やす）
        </button>

    </div>

    <div class="controls">

        <span>アリの並べ方：</span>

        <div class="direction-buttons">

            <button id="horizontalButton" class="active">
                横
            </button>

            <button id="verticalButton">
                縦
            </button>

        </div>

    </div>

    <div class="info">

        <div>
            開けたマス数：
            <strong id="gapDisplay">0</strong>
        </div>

        <div>
            ステップ数：
            <strong id="stepDisplay">0</strong>
        </div>

        <div>
            配置：
            <strong id="layoutDisplay">横</strong>
        </div>

        <div>
            速度：
            <strong id="speedDisplay">20 steps/s</strong>
        </div>

    </div>

    <div id="canvasWrapper">
        <canvas id="canvas"></canvas>
    </div>

</div>


<script>

// ========================================
// 基本設定
// ========================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CELL_SIZE = 25;

const GRID_WIDTH = 120;
const GRID_HEIGHT = 70;


// ========================================
// 状態
// ========================================

let blackCells = [];

let ants = [];

let gap = 0;

let stepCount = 0;

let layout = "horizontal";

let running = false;

let timer = null;

// 初期速度
let speed = 20;

// 速度の最大値
const MAX_SPEED = 10000000000000;


// ========================================
// 方向
// ========================================

// 0 = 上
// 1 = 右
// 2 = 下
// 3 = 左

const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];


// ========================================
// Canvas
// ========================================

canvas.width = GRID_WIDTH * CELL_SIZE;
canvas.height = GRID_HEIGHT * CELL_SIZE;


// ========================================
// マスのキー
// ========================================

function cellKey(x, y) {
    return `${x},${y}`;
}


// ========================================
// 初期化
// ========================================

function resetSimulation() {

    blackCells = [];

    stepCount = 0;

    const centerX = Math.floor(GRID_WIDTH / 2);
    const centerY = Math.floor(GRID_HEIGHT / 2);

    // ====================================
    // 初期の向き
    // 0 = 上
    // ====================================

    if (layout === "horizontal") {

        ants = [
            {
                x: centerX - Math.floor((gap + 1) / 2),
                y: centerY,
                direction: 0
            },
            {
                x: centerX + Math.ceil((gap + 1) / 2),
                y: centerY,
                direction: 0
            }
        ];

    } else {

        ants = [
            {
                x: centerX,
                y: centerY - Math.floor((gap + 1) / 2),
                direction: 0
            },
            {
                x: centerX,
                y: centerY + Math.ceil((gap + 1) / 2),
                direction: 0
            }
        ];
    }

    updateInfo();
    draw();
}


// ========================================
// 1ステップ
// ========================================

function stepSimulation() {

    // 現在の状態を保存
    const currentStates = ants.map(ant => ({
        x: ant.x,
        y: ant.y,
        direction: ant.direction,
        black: blackCells.includes(cellKey(ant.x, ant.y))
    }));


    // ====================================
    // 向きを変更
    // ====================================

    currentStates.forEach((state, i) => {

        const ant = ants[i];

        if (!state.black) {

            // 白 → 右90度
            ant.direction =
                (state.direction + 1) % 4;

        } else {

            // 黒 → 左90度
            ant.direction =
                (state.direction + 3) % 4;
        }

    });


    // ====================================
    // マスを反転
    // ====================================

    currentStates.forEach(state => {

        const key = cellKey(state.x, state.y);

        const index = blackCells.indexOf(key);

        if (index === -1) {

            blackCells.push(key);

        } else {

            blackCells.splice(index, 1);

        }

    });


    // ====================================
    // アリを進める
    // ====================================

    ants.forEach(ant => {

        ant.x += DX[ant.direction];
        ant.y += DY[ant.direction];

    });


    stepCount++;

    updateInfo();
    draw();
}


// ========================================
// 描画
// ========================================

function draw() {

    ctx.fillStyle = "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ====================================
    // グリッド
    // ====================================

    ctx.strokeStyle = "#dddddd";
    ctx.lineWidth = 1;

    for (let x = 0; x <= GRID_WIDTH; x++) {

        ctx.beginPath();

        ctx.moveTo(
            x * CELL_SIZE,
            0
        );

        ctx.lineTo(
            x * CELL_SIZE,
            canvas.height
        );

        ctx.stroke();
    }

    for (let y = 0; y <= GRID_HEIGHT; y++) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * CELL_SIZE
        );

        ctx.lineTo(
            canvas.width,
            y * CELL_SIZE
        );

        ctx.stroke();
    }


    // ====================================
    // 黒マス
    // ====================================

    ctx.fillStyle = "#222";

    blackCells.forEach(key => {

        const [x, y] =
            key.split(",").map(Number);

        ctx.fillRect(
            x * CELL_SIZE,
            y * CELL_SIZE,
            CELL_SIZE,
            CELL_SIZE
        );

    });


    // ====================================
    // アリ
    // ====================================

    ants.forEach((ant, index) => {

        const screenX =
            ant.x * CELL_SIZE;

        const screenY =
            ant.y * CELL_SIZE;

        const cx =
            screenX + CELL_SIZE / 2;

        const cy =
            screenY + CELL_SIZE / 2;


        // アリ本体

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            CELL_SIZE * 0.35,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            index === 0
                ? "#e53935"
                : "#1976d2";

        ctx.fill();


        // 向き

        drawDirection(
            cx,
            cy,
            ant.direction
        );

    });

}


// ========================================
// アリの向きを描画
// ========================================

function drawDirection(cx, cy, direction) {

    const size = CELL_SIZE * 0.25;

    ctx.fillStyle = "white";

    ctx.beginPath();

    if (direction === 0) {

        // 上
        ctx.moveTo(
            cx,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );

    } else if (direction === 1) {

        // 右
        ctx.moveTo(
            cx + size,
            cy
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

    } else if (direction === 2) {

        // 下
        ctx.moveTo(
            cx,
            cy + size
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

    } else {

        // 左
        ctx.moveTo(
            cx - size,
            cy
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );
    }

    ctx.closePath();

    ctx.fill();
}


// ========================================
// 情報更新
// ========================================

function updateInfo() {

    document.getElementById("gapDisplay")
        .textContent = gap;

    document.getElementById("stepDisplay")
        .textContent = stepCount;

    document.getElementById("layoutDisplay")
        .textContent =
            layout === "horizontal"
                ? "横"
                : "縦";

    document.getElementById("speedDisplay")
        .textContent =
            speed + " steps/s";
}


// ========================================
// 自動再生
// ========================================

function toggleRunning() {

    running = !running;

    const button =
        document.getElementById("startButton");

    if (running) {

        button.textContent = "⏸ 停止";

        startTimer();

    } else {

        button.textContent = "▶ 自動再生";

        clearInterval(timer);
    }
}


// ========================================
// タイマー開始
// ========================================

function startTimer() {

    clearInterval(timer);

    const interval =
        1000 / speed;

    timer = setInterval(() => {

        stepSimulation();

    }, interval);
}


// ========================================
// 速くする
// ========================================

function increaseSpeed() {

    speed += 10;

    if (speed > MAX_SPEED) {
        speed = MAX_SPEED;
    }

    updateInfo();

    // 自動再生中なら速度を即反映
    if (running) {
        startTimer();
    }
}


// ========================================
// 次の実験
// ========================================

function nextExperiment() {

    if (running) {

        running = false;

        clearInterval(timer);

        document.getElementById("startButton")
            .textContent = "▶ 自動再生";
    }

    gap++;

    resetSimulation();
}


// ========================================
// 横
// ========================================

document
    .getElementById("horizontalButton")
    .addEventListener("click", () => {

        if (layout === "horizontal") {
            return;
        }

        layout = "horizontal";

        document
            .getElementById("horizontalButton")
            .classList.add("active");

        document
            .getElementById("verticalButton")
            .classList.remove("active");

        resetSimulation();
    });


// ========================================
// 縦
// ========================================

document
    .getElementById("verticalButton")
    .addEventListener("click", () => {

        if (layout === "vertical") {
            return;
        }

        layout = "vertical";

        document
            .getElementById("verticalButton")
            .classList.add("active");

        document
            .getElementById("horizontalButton")
            .classList.remove("active");

        resetSimulation();
    });


// ========================================
// ボタン
// ========================================

document
    .getElementById("stepButton")
    .addEventListener("click", () => {

        stepSimulation();
    });


document
    .getElementById("startButton")
    .addEventListener("click", () => {

        toggleRunning();
    });


document
    .getElementById("speedButton")
    .addEventListener("click", () => {

        increaseSpeed();
    });


document
    .getElementById("resetButton")
    .addEventListener("click", () => {

        resetSimulation();
    });


document
    .getElementById("nextButton")
    .addEventListener("click", () => {

        nextExperiment();
    });


// ========================================
// 開始
// ========================================

resetSimulation();

</script>

</body>
</html>
