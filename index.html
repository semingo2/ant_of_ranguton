<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2匹のラングトンのアリ シミュレーター</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, "Yu Gothic", sans-serif;
    background: #eeeeee;
    color: #222;
    overflow: hidden;
}
.control-panel {
    background: #fff;
    border-bottom: 1px solid #aaa;
    padding: 10px 14px;
    box-shadow: 0 2px 5px rgba(0,0,0,.12);
    position: relative;
    z-index: 10;
}
.row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 8px;
}
.row:last-child { margin-bottom: 0; }
button, select, input { font-size: 14px; }
button {
    border: 1px solid #999;
    background: #f8f8f8;
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
}
button:hover { background: #e8e8e8; }
button:active { background: #d8d8d8; }
select {
    padding: 6px 8px;
    border: 1px solid #999;
    border-radius: 5px;
    background: #fff;
}
input[type="number"] {
    width: 90px;
    padding: 6px;
    border: 1px solid #999;
    border-radius: 5px;
}
input[type="range"] { vertical-align: middle; }
.label { font-weight: bold; margin-left: 4px; }
.ant1-label { color: #d00000; }
.ant2-label { color: #0055cc; }
#speedSlider { width: 220px; }
#speedValue { display: inline-block; min-width: 55px; font-weight: bold; }
#status { font-weight: bold; margin-left: 8px; }
#stepCount { font-weight: bold; }
.grid-wrapper {
    width: 100vw;
    height: calc(100vh - 132px);
    overflow: auto;
    background: #aaa;
    padding: 20px;
}
#gridCanvas {
    display: block;
    background: #fff;
    image-rendering: pixelated;
}
.info {
    font-size: 13px;
    color: #555;
}
</style>
</head>
<body>

<div class="control-panel">
    <div class="row">
        <button id="startStopButton">開始</button>
        <button id="stepButton">1マス進む</button>
        <button id="resetButton">リセット</button>

        <span class="label">間隔：</span>
        <input id="spacingInput" type="number" min="0" max="298" value="0">
        <span>マス</span>

        <span class="label">現在：</span>
        <strong id="spacingValue">0</strong>
        <span>マス</span>
    </div>

    <div class="row">
        <span class="label">向きを変更：</span>

        <span class="label ant1-label">アリ1：</span>
        <select id="ant1Direction">
            <option value="0" selected>上</option>
            <option value="1">右</option>
            <option value="2">下</option>
            <option value="3">左</option>
        </select>

        <span class="label ant2-label">アリ2：</span>
        <select id="ant2Direction">
            <option value="0" selected>上</option>
            <option value="1">右</option>
            <option value="2">下</option>
            <option value="3">左</option>
        </select>
    </div>

    <div class="row">
        <span class="label">速度：</span>
        <input id="speedSlider" type="range" min="100" max="10000" value="1000" step="1">
        <span id="speedValue">1000</span>
        <span>step/s</span>

        <span class="label">マスサイズ：</span>
        <select id="cellSizeSelect">
            <option value="5" selected>5 px</option>
            <option value="10">10 px</option>
            <option value="20">20 px</option>
        </select>

        <span>
            ステップ数：
            <strong id="stepCount">0</strong>
        </span>
        <span id="status">停止中</span>
    </div>

    <div class="info">
        白 → 黒・右90°回転・前進 ／ 黒 → 白・左90°回転・前進
        ｜ 赤＝アリ1、青＝アリ2
    </div>
</div>

<div class="grid-wrapper" id="gridWrapper">
    <canvas id="gridCanvas"></canvas>
</div>

<script>
"use strict";

/* =========================
   基本設定
========================= */
const COLS = 300;
const ROWS = 200;
const cells = new Uint8Array(COLS * ROWS);

const canvas = document.getElementById("gridCanvas");
const ctx = canvas.getContext("2d", { alpha: false });
const gridWrapper = document.getElementById("gridWrapper");

const startStopButton = document.getElementById("startStopButton");
const stepButton = document.getElementById("stepButton");
const resetButton = document.getElementById("resetButton");

const spacingInput = document.getElementById("spacingInput");
const spacingValue = document.getElementById("spacingValue");

const ant1DirectionSelect = document.getElementById("ant1Direction");
const ant2DirectionSelect = document.getElementById("ant2Direction");

const speedSlider = document.getElementById("speedSlider");
const speedValue = document.getElementById("speedValue");

const cellSizeSelect = document.getElementById("cellSizeSelect");
const stepCountDisplay = document.getElementById("stepCount");
const statusDisplay = document.getElementById("status");

/* 0=上, 1=右, 2=下, 3=左 */
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const ants = [
    { x: 0, y: 0, direction: 0, stopped: false },
    { x: 0, y: 0, direction: 0, stopped: false }
];

let spacing = 0;
let cellSize = 5;
let stepsPerSecond = 1000;
let stepCount = 0;

let running = false;
let lastTime = 0;
let accumulatedTime = 0;

/* =========================
   初期配置
   2匹を中央に横一列で配置
========================= */
function setInitialPositions() {
    const centerX = Math.floor(COLS / 2);
    const centerY = Math.floor(ROWS / 2);

    /*
      間隔0なら隣り合う位置。
      間隔1なら1マス空ける。
    */
    const distance = spacing + 1;

    let x1 = Math.floor(centerX - (distance - 1) / 2);
    let x2 = x1 + distance;

    /* 必ず300×200の中に入れる */
    if (x1 < 0) {
        x1 = 0;
        x2 = distance;
    }
    if (x2 >= COLS) {
        x2 = COLS - 1;
        x1 = x2 - distance;
    }
    if (x1 < 0) x1 = 0;

    ants[0].x = x1;
    ants[0].y = centerY;
    ants[1].x = x2;
    ants[1].y = centerY;

    /* 現在設定されている向きを使用 */
    ants[0].direction = Number(ant1DirectionSelect.value);
    ants[1].direction = Number(ant2DirectionSelect.value);

    ants[0].stopped = false;
    ants[1].stopped = false;
}

/* =========================
   初期位置へ移動して表示
   間隔変更・マスサイズ変更でも使用
========================= */
function moveViewToCenter() {
    requestAnimationFrame(() => {
        gridWrapper.scrollLeft =
            Math.max(0, (canvas.width - gridWrapper.clientWidth) / 2);
        gridWrapper.scrollTop =
            Math.max(0, (canvas.height - gridWrapper.clientHeight) / 2);
    });
}

/* =========================
   リセット
   向き・間隔は維持
========================= */
function resetSimulation() {
    running = false;
    startStopButton.textContent = "開始";
    statusDisplay.textContent = "停止中";

    stepCount = 0;
    stepCountDisplay.textContent = "0";

    cells.fill(0);
    setInitialPositions();
    draw();
    moveViewToCenter();
}

/* =========================
   1ステップ
   2匹を同時に処理する
========================= */
function stepSimulation() {
    const operations = [];

    /*
      第1段階：
      2匹とも「現在のマス」を先に読む。
      ここではまだマスを書き換えない。
    */
    for (let i = 0; i < 2; i++) {
        const ant = ants[i];

        if (ant.stopped) {
            operations.push(null);
            continue;
        }

        const index = ant.y * COLS + ant.x;
        const wasBlack = cells[index] === 1;

        const newDirection = wasBlack
            ? (ant.direction + 3) % 4
            : (ant.direction + 1) % 4;

        const newCell = wasBlack ? 0 : 1;

        operations.push({
            index,
            newCell,
            newDirection
        });
    }

    /*
      第2段階：
      2匹分のマス変更と方向変更。
    */
    for (let i = 0; i < 2; i++) {
        const op = operations[i];
        if (!op) continue;

        cells[op.index] = op.newCell;
        ants[i].direction = op.newDirection;
    }

    /*
      第3段階：
      2匹を同時に前進させる。
    */
    for (let i = 0; i < 2; i++) {
        const op = operations[i];
        if (!op) continue;

        const ant = ants[i];

        const nextX = ant.x + DX[ant.direction];
        const nextY = ant.y + DY[ant.direction];

        if (
            nextX < 0 ||
            nextX >= COLS ||
            nextY < 0 ||
            nextY >= ROWS
        ) {
            ant.stopped = true;
        } else {
            ant.x = nextX;
            ant.y = nextY;
        }
    }

    stepCount++;
    stepCountDisplay.textContent = stepCount.toLocaleString();
}

/* =========================
   描画
========================= */
function resizeCanvas() {
    canvas.width = COLS * cellSize;
    canvas.height = ROWS * cellSize;
    draw();
    moveViewToCenter();
}

function draw() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* 黒マス */
    ctx.fillStyle = "#222222";

    for (let y = 0; y < ROWS; y++) {
        const row = y * COLS;

        for (let x = 0; x < COLS; x++) {
            if (cells[row + x] === 1) {
                ctx.fillRect(
                    x * cellSize,
                    y * cellSize,
                    cellSize,
                    cellSize
                );
            }
        }
    }

    /* グリッド線 */
    ctx.beginPath();
    ctx.strokeStyle = cellSize <= 5 ? "#cccccc" : "#b5b5b5";
    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {
        const px = x * cellSize + 0.5;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
    }

    for (let y = 0; y <= ROWS; y++) {
        const py = y * cellSize + 0.5;
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
    }

    ctx.stroke();

    drawAnt(ants[0], "#e00000");
    drawAnt(ants[1], "#0066dd");
}

/* =========================
   アリ描画
========================= */
function drawAnt(ant, color) {
    const cx = ant.x * cellSize + cellSize / 2;
    const cy = ant.y * cellSize + cellSize / 2;

    const margin = Math.max(0.7, cellSize * 0.12);

    const left = ant.x * cellSize + margin;
    const right = (ant.x + 1) * cellSize - margin;
    const top = ant.y * cellSize + margin;
    const bottom = (ant.y + 1) * cellSize - margin;

    ctx.fillStyle = ant.stopped ? "#777777" : color;

    ctx.beginPath();

    if (ant.direction === 0) {
        ctx.moveTo(cx, top);
        ctx.lineTo(right, bottom);
        ctx.lineTo(left, bottom);
    } else if (ant.direction === 1) {
        ctx.moveTo(right, cy);
        ctx.lineTo(left, top);
        ctx.lineTo(left, bottom);
    } else if (ant.direction === 2) {
        ctx.moveTo(cx, bottom);
        ctx.lineTo(left, top);
        ctx.lineTo(right, top);
    } else {
        ctx.moveTo(left, cy);
        ctx.lineTo(right, bottom);
        ctx.lineTo(right, top);
    }

    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(0.7, cellSize * 0.08);
    ctx.stroke();
}

/* =========================
   自動実行
========================= */
function animationLoop(timestamp) {
    if (!running) return;

    if (lastTime === 0) lastTime = timestamp;

    const elapsed = Math.min(timestamp - lastTime, 100);
    lastTime = timestamp;
    accumulatedTime += elapsed;

    const interval = 1000 / stepsPerSecond;
    const maxStepsPerFrame = 500;

    let count = 0;

    while (
        accumulatedTime >= interval &&
        count < maxStepsPerFrame
    ) {
        stepSimulation();
        accumulatedTime -= interval;
        count++;
    }

    if (count > 0) draw();

    if (ants[0].stopped && ants[1].stopped) {
        running = false;
        startStopButton.textContent = "開始";
        statusDisplay.textContent = "両方停止";
        draw();
        return;
    }

    requestAnimationFrame(animationLoop);
}

function toggleRunning() {
    if (running) {
        running = false;
        startStopButton.textContent = "開始";
        statusDisplay.textContent = "停止中";
        return;
    }

    if (ants[0].stopped && ants[1].stopped) return;

    running = true;
    startStopButton.textContent = "停止";
    statusDisplay.textContent = "実行中";
    lastTime = 0;
    accumulatedTime = 0;

    requestAnimationFrame(animationLoop);
}

/* =========================
   1マス進む
========================= */
function oneStep() {
    if (running) {
        running = false;
        startStopButton.textContent = "開始";
        statusDisplay.textContent = "停止中";
    }

    if (!(ants[0].stopped && ants[1].stopped)) {
        stepSimulation();
        draw();
    }
}

/* =========================
   間隔
   数字を変更した瞬間に反映
   最重要仕様
========================= */
function applySpacingImmediately() {
    let value = Number(spacingInput.value);

    if (!Number.isFinite(value)) value = 0;

    value = Math.floor(value);
    value = Math.max(0, Math.min(COLS - 2, value));

    spacing = value;

    /*
      数字を変えた瞬間、
      初期配置を即座に再配置する。
    */
    spacingValue.textContent = spacing;
    spacingInput.value = spacing;

    /*
      シミュレーション中でも、
      間隔設定を変更したら初期配置へ戻す。
      グリッドは消さず、設定変更だけを即時反映。
    */
    running = false;
    startStopButton.textContent = "開始";
    statusDisplay.textContent = "停止中";

    setInitialPositions();
    draw();
    moveViewToCenter();
}

/* inputイベントなので入力中に即反映 */
spacingInput.addEventListener("input", applySpacingImmediately);

/* =========================
   向き
   変更した瞬間に反映
========================= */
ant1DirectionSelect.addEventListener("change", () => {
    ants[0].direction = Number(ant1DirectionSelect.value);
    draw();
});

ant2DirectionSelect.addEventListener("change", () => {
    ants[1].direction = Number(ant2DirectionSelect.value);
    draw();
});

/* =========================
   速度
========================= */
speedSlider.addEventListener("input", () => {
    stepsPerSecond = Number(speedSlider.value);
    speedValue.textContent = stepsPerSecond.toLocaleString();
});

/* =========================
   マスサイズ
   変更した瞬間に反映し、
   表示位置を中央へ移動
========================= */
cellSizeSelect.addEventListener("change", () => {
    cellSize = Number(cellSizeSelect.value);

    /*
      マスサイズ変更時は、
      シミュレーションを止めずに表示サイズだけ変更。
      変更後は中央を見る。
    */
    resizeCanvas();
});

/* =========================
   ボタン
========================= */
startStopButton.addEventListener("click", toggleRunning);
stepButton.addEventListener("click", oneStep);
resetButton.addEventListener("click", resetSimulation);

/* =========================
   初期化
========================= */
function initialize() {
    cells.fill(0);

    spacing = 0;
    cellSize = 5;
    stepsPerSecond = Number(speedSlider.value);

    ant1DirectionSelect.value = "0";
    ant2DirectionSelect.value = "0";
    spacingInput.value = "0";

    spacingValue.textContent = "0";
    speedValue.textContent = stepsPerSecond.toLocaleString();
    stepCountDisplay.textContent = "0";

    setInitialPositions();
    resizeCanvas();
}

initialize();
</script>

</body>
</html>
