<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ラングトンのアリ 2匹実験</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

.container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}


/* ==========================================
   上部
========================================== */

.header {
    flex-shrink: 0;
    padding: 12px 16px 8px;
    background: #f3f3f3;
}

h1 {
    margin: 0 0 10px;
    font-size: 24px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 14px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #444;
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

button.active {
    background: #555;
}


/* ==========================================
   アリ選択ボタン
========================================== */

.ant-select-1 {
    background: #e53935;
}

.ant-select-2 {
    background: #1976d2;
}

.ant-select-1.active {
    outline: 3px solid white;
    box-shadow: 0 0 0 5px #e53935;
}

.ant-select-2.active {
    outline: 3px solid white;
    box-shadow: 0 0 0 5px #1976d2;
}


/* ==========================================
   向き設定
========================================== */

.direction-box {
    background: white;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
}

.direction-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.direction-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
}

.direction-name {
    width: 105px;
    font-weight: bold;
}

.ant1-direction.active {
    background: #e53935;
}

.ant2-direction.active {
    background: #1976d2;
}

.direction-status {
    margin-left: 8px;
    font-size: 13px;
}


/* ==========================================
   速度
========================================== */

.speed-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
    margin-bottom: 8px;
}

#speedSlider {
    width: min(600px, 60vw);
    flex: 1;
}

#speedValue {
    min-width: 190px;
    font-weight: bold;
    text-align: right;
}


/* ==========================================
   情報
========================================== */

.info {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
}


/* ==========================================
   実験エリア
========================================== */

.experiment-area {
    flex: 1;
    min-height: 0;
    display: flex;
}


/* ==========================================
   左側ズーム
========================================== */

.zoom-panel {
    width: 62px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #e7e7e7;
    border-right: 1px solid #ccc;
}

.zoom-title {
    writing-mode: vertical-rl;
    font-size: 12px;
    margin-bottom: 10px;
}

.zoom-slider {
    writing-mode: vertical-lr;
    direction: rtl;

    width: 28px;
    height: 300px;
}

.zoom-label {
    font-size: 11px;
    margin-top: 8px;
}


/* ==========================================
   キャンバス
========================================== */

.canvas-wrapper {
    flex: 1;
    min-width: 0;
    min-height: 0;

    overflow: auto;
    background: white;

    position: relative;
}

canvas {
    display: block;
}

</style>
</head>


<body>

<div class="container">

    <div class="header">

        <h1>🐜 ラングトンのアリ 2匹実験</h1>


        <!-- ==================================
             基本操作
        ================================== -->

        <div class="controls">

            <button id="stepButton">
                1ステップ進む
            </button>

            <button id="startButton">
                ▶ 自動再生
            </button>

            <button id="resetButton">
                ↻ リセット
            </button>

        </div>


        <!-- ==================================
             アリ選択
        ================================== -->

        <div class="controls">

            <b>アリを選択：</b>

            <button
                id="ant1Button"
                class="ant-select-1"
            >
                アリ1
            </button>

            <button
                id="ant2Button"
                class="ant-select-2"
            >
                アリ2
            </button>

            <span id="selectedAntText">
                選択なし
            </span>

        </div>


        <!-- ==================================
             間隔
        ================================== -->

        <div class="controls">

            <b>開けたマス数：</b>

            <button id="previousGapButton">
                ← 減らす
            </button>

            <button id="nextGapButton">
                増やす →
            </button>

        </div>


        <!-- ==================================
             向き設定
        ================================== -->

        <div class="direction-box">

            <div class="direction-title">
                初期の向き
            </div>


            <!-- アリ1 -->

            <div class="direction-row">

                <span class="direction-name">
                    🔴 アリ1：
                </span>

                <button
                    class="ant1-direction"
                    data-direction="0"
                    id="ant1Up"
                >
                    ↑ 上
                </button>

                <button
                    class="ant1-direction"
                    data-direction="1"
                >
                    → 右
                </button>

                <button
                    class="ant1-direction"
                    data-direction="2"
                >
                    ↓ 下
                </button>

                <button
                    class="ant1-direction"
                    data-direction="3"
                >
                    ← 左
                </button>

                <span
                    id="ant1DirectionStatus"
                    class="direction-status"
                >
                    未選択
                </span>

            </div>


            <!-- アリ2 -->

            <div class="direction-row">

                <span class="direction-name">
                    🔵 アリ2：
                </span>

                <button
                    class="ant2-direction"
                    data-direction="0"
                    disabled
                >
                    ↑ 上
                </button>

                <button
                    class="ant2-direction"
                    data-direction="1"
                    disabled
                >
                    → 右
                </button>

                <button
                    class="ant2-direction"
                    data-direction="2"
                    disabled
                >
                    ↓ 下
                </button>

                <button
                    class="ant2-direction"
                    data-direction="3"
                    disabled
                >
                    ← 左
                </button>

                <span
                    id="ant2DirectionStatus"
                    class="direction-status"
                >
                    アリ1を先に選択
                </span>

            </div>

        </div>


        <!-- ==================================
             速度
        ================================== -->

        <div class="speed-box">

            <b>速度：</b>

            <input
                id="speedSlider"
                type="range"
                min="0"
                max="100"
                value="0"
                step="1"
            >

            <span id="speedValue">
                100 steps/s
            </span>

        </div>


        <!-- ==================================
             情報
        ================================== -->

        <div class="info">

            <div>
                開けたマス数：
                <strong id="gapDisplay">0</strong>
            </div>

            <div>
                ステップ数：
                <strong id="stepDisplay">0</strong>
            </div>

            <div>
                アリ1：
                <strong id="ant1Info">未設定</strong>
            </div>

            <div>
                アリ2：
                <strong id="ant2Info">未設定</strong>
            </div>

            <div>
                マスサイズ：
                <strong id="cellSizeDisplay">8</strong> px
            </div>

        </div>

    </div>


    <!-- ======================================
         実験画面
    ======================================= -->

    <div class="experiment-area">


        <!-- ==================================
             ズーム
        ================================== -->

        <div class="zoom-panel">

            <div class="zoom-title">
                🔍 拡大・縮小
            </div>

            <span class="zoom-label">
                大
            </span>

            <input
                id="zoomSlider"
                class="zoom-slider"
                type="range"
                min="2"
                max="16"
                step="1"
                value="8"
            >

            <span class="zoom-label">
                小
            </span>

        </div>


        <!-- ==================================
             Canvas
        ================================== -->

        <div
            id="canvasWrapper"
            class="canvas-wrapper"
        >

            <canvas id="canvas"></canvas>

        </div>

    </div>

</div>


<script>


// =====================================================
// グリッド
// =====================================================

const GRID_WIDTH = 1200;
const GRID_HEIGHT = 800;

let CELL_SIZE = 8;


// =====================================================
// Canvas
// =====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


// =====================================================
// 状態
// =====================================================

// 0 = 白
// 1 = 黒

let grid =
    new Uint8Array(
        GRID_WIDTH * GRID_HEIGHT
    );


let ants = [];


// 開けたマス数
let gap = 0;


// ステップ数
let stepCount = 0;


// 選択中のアリ
// null / 0 / 1

let selectedAnt = null;


// 初期方向
let ant1InitialDirection = null;
let ant2InitialDirection = null;


// 実行中
let running = false;

let animationFrame = null;


// =====================================================
// 方向
// =====================================================

// 0 = 上
// 1 = 右
// 2 = 下
// 3 = 左

const DX = [
    0,
    1,
    0,
    -1
];

const DY = [
    -1,
    0,
    1,
    0
];


const DIRECTION_NAME = [
    "上",
    "右",
    "下",
    "左"
];


// =====================================================
// Canvasサイズ
// =====================================================

function updateCanvasSize() {

    canvas.width =
        GRID_WIDTH * CELL_SIZE;

    canvas.height =
        GRID_HEIGHT * CELL_SIZE;

}


// =====================================================
// グリッド位置
// =====================================================

function gridIndex(x, y) {

    if (
        x < 0 ||
        x >= GRID_WIDTH ||
        y < 0 ||
        y >= GRID_HEIGHT
    ) {
        return -1;
    }

    return (
        y * GRID_WIDTH + x
    );
}


// =====================================================
// 初期配置
// =====================================================

function resetSimulation() {

    // シミュレーション停止
    if (running) {

        running = false;

        cancelAnimationFrame(
            animationFrame
        );

        document
            .getElementById(
                "startButton"
            )
            .textContent =
                "▶ 自動再生";
    }


    // 全マス白
    grid.fill(0);

    stepCount = 0;


    // まだ方向未選択なら描画だけ
    if (
        ant1InitialDirection === null ||
        ant2InitialDirection === null
    ) {

        ants = [];

        updateInfo();
        draw();

        return;
    }


    // 中央
    const centerX =
        Math.floor(
            GRID_WIDTH / 2
        );

    const centerY =
        Math.floor(
            GRID_HEIGHT / 2
        );


    /*
     * 横一直線に配置
     *
     * gap = 0
     * 🔴🔵
     *
     * gap = 1
     * 🔴□🔵
     *
     * gap = 2
     * 🔴□□🔵
     */

    const distance =
        gap + 1;


    // 中央から左右に配置

    const ant1X =
        centerX -
        Math.floor(
            distance / 2
        );

    const ant2X =
        ant1X +
        distance;


    ants = [

        {
            x: ant1X,
            y: centerY,
            direction:
                ant1InitialDirection
        },

        {
            x: ant2X,
            y: centerY,
            direction:
                ant2InitialDirection
        }

    ];


    updateInfo();

    draw();


    // 選択中のアリを追跡
    if (
        selectedAnt !== null
    ) {

        focusOnAnt(
            selectedAnt
        );

    }

}


// =====================================================
// 1ステップ進む
// =====================================================

function stepSimulation() {

    if (ants.length !== 2) {
        return;
    }


    /*
     * 2匹の現在状態を最初に保存。
     *
     * これによって、
     * アリ1が先に処理された結果を
     * アリ2が利用することはありません。
     */

    const states =
        ants.map(
            ant => {

                const index =
                    gridIndex(
                        ant.x,
                        ant.y
                    );

                return {

                    x: ant.x,
                    y: ant.y,

                    direction:
                        ant.direction,

                    color:
                        index >= 0
                            ? grid[index]
                            : 0

                };

            }
        );


    // =================================================
    // 向き変更
    // =================================================

    states.forEach(
        (state, i) => {

            if (
                state.color === 0
            ) {

                // 白 → 右90°

                ants[i].direction =
                    (
                        state.direction +
                        1
                    ) % 4;

            }

            else {

                // 黒 → 左90°

                ants[i].direction =
                    (
                        state.direction +
                        3
                    ) % 4;

            }

        }
    );


    // =================================================
    // マスを反転
    // =================================================

    states.forEach(
        state => {

            const index =
                gridIndex(
                    state.x,
                    state.y
                );


            if (index >= 0) {

                grid[index] =
                    grid[index] === 0
                        ? 1
                        : 0;

            }

        }
    );


    // =================================================
    // 移動
    // =================================================

    ants.forEach(
        ant => {

            ant.x +=
                DX[ant.direction];

            ant.y +=
                DY[ant.direction];

        }
    );


    stepCount++;

}


// =====================================================
// 複数ステップ
// =====================================================

function runSteps(count) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        stepSimulation();

    }

}


// =====================================================
// 速度
// =====================================================

const speedSlider =
    document.getElementById(
        "speedSlider"
    );


function getSpeed() {

    const value =
        Number(
            speedSlider.value
        );


    /*
     * 100 ～ 100000 steps/s
     *
     * 対数スケール
     */

    const exponent =
        2 +
        (
            value / 100
        ) * 3;


    return Math.pow(
        10,
        exponent
    );

}


function formatSpeed(value) {

    return Math.round(
        value
    ).toLocaleString();

}


function updateSpeedDisplay() {

    document.getElementById(
        "speedValue"
    ).textContent =
        formatSpeed(
            getSpeed()
        ) +
        " steps/s";

}


speedSlider.addEventListener(
    "input",
    updateSpeedDisplay
);


// =====================================================
// 自動再生
// =====================================================

function animate() {

    if (!running) {
        return;
    }


    const speed =
        getSpeed();


    /*
     * 60FPSを基準にする。
     */

    let steps =
        Math.floor(
            speed / 60
        );


    /*
     * 100,000 steps/s が最大。
     */

    steps =
        Math.max(
            1,
            Math.min(
                steps,
                1667
            )
        );


    runSteps(
        steps
    );


    updateInfo();

    draw();


    animationFrame =
        requestAnimationFrame(
            animate
        );

}


// =====================================================
// 自動再生切替
// =====================================================

function toggleRunning() {

    if (ants.length !== 2) {

        alert(
            "アリ1とアリ2の初期方向を選択してください。"
        );

        return;
    }


    running =
        !running;


    const button =
        document.getElementById(
            "startButton"
        );


    if (running) {

        button.textContent =
            "⏸ 停止";

        animationFrame =
            requestAnimationFrame(
                animate
            );

    }

    else {

        button.textContent =
            "▶ 自動再生";

        cancelAnimationFrame(
            animationFrame
        );

    }

}


// =====================================================
// 描画
// =====================================================

function draw() {

    updateCanvasSize();


    // =================================================
    // 背景
    // =================================================

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =================================================
    // グリッド
    // =================================================

    if (
        CELL_SIZE >= 5
    ) {

        ctx.strokeStyle =
            "#e5e5e5";

        ctx.lineWidth = 1;


        for (
            let x = 0;
            x <= GRID_WIDTH;
            x++
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x * CELL_SIZE,
                0
            );

            ctx.lineTo(
                x * CELL_SIZE,
                canvas.height
            );

            ctx.stroke();

        }


        for (
            let y = 0;
            y <= GRID_HEIGHT;
            y++
        ) {

            ctx.beginPath();

            ctx.moveTo(
                0,
                y * CELL_SIZE
            );

            ctx.lineTo(
                canvas.width,
                y * CELL_SIZE
            );

            ctx.stroke();

        }

    }


    // =================================================
    // 黒マス
    // =================================================

    ctx.fillStyle =
        "#222";


    for (
        let y = 0;
        y < GRID_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_WIDTH;
            x++
        ) {

            if (
                grid[
                    y * GRID_WIDTH + x
                ] === 1
            ) {

                ctx.fillRect(

                    x * CELL_SIZE,

                    y * CELL_SIZE,

                    CELL_SIZE,

                    CELL_SIZE

                );

            }

        }

    }


    // =================================================
    // アリ
    // =================================================

    ants.forEach(
        (ant, index) => {

            /*
             * グリッド外なら描画しない
             */

            if (
                ant.x < 0 ||
                ant.x >= GRID_WIDTH ||
                ant.y < 0 ||
                ant.y >= GRID_HEIGHT
            ) {

                return;

            }


            const x =
                ant.x * CELL_SIZE;

            const y =
                ant.y * CELL_SIZE;


            const cx =
                x +
                CELL_SIZE / 2;

            const cy =
                y +
                CELL_SIZE / 2;


            // =================================================
            // 選択中のアリを強調
            // =================================================

            if (
                selectedAnt === index
            ) {

                ctx.beginPath();

                ctx.arc(

                    cx,

                    cy,

                    CELL_SIZE * 0.8,

                    0,

                    Math.PI * 2

                );

                ctx.strokeStyle =
                    "#ff9800";

                ctx.lineWidth =
                    Math.max(
                        2,
                        CELL_SIZE * 0.15
                    );

                ctx.stroke();


                // 十字線

                ctx.beginPath();

                ctx.moveTo(
                    cx - CELL_SIZE,
                    cy
                );

                ctx.lineTo(
                    cx + CELL_SIZE,
                    cy
                );

                ctx.moveTo(
                    cx,
                    cy - CELL_SIZE
                );

                ctx.lineTo(
                    cx,
                    cy + CELL_SIZE
                );

                ctx.strokeStyle =
                    "#ff9800";

                ctx.lineWidth = 1;

                ctx.stroke();

            }


            // =================================================
            // アリ本体
            // =================================================

            ctx.beginPath();

            ctx.arc(

                cx,

                cy,

                Math.max(
                    2,
                    CELL_SIZE * 0.42
                ),

                0,

                Math.PI * 2

            );


            // アリ1 = 赤
            // アリ2 = 青

            ctx.fillStyle =
                index === 0
                    ? "#e53935"
                    : "#1976d2";

            ctx.fill();


            // =================================================
            // 向き
            // =================================================

            if (
                CELL_SIZE >= 5
            ) {

                drawDirection(
                    cx,
                    cy,
                    ant.direction
                );

            }

        }
    );

}


// =====================================================
// アリの向き
// =====================================================

function drawDirection(
    cx,
    cy,
    direction
) {

    const size =
        CELL_SIZE * 0.25;


    ctx.fillStyle =
        "white";


    ctx.beginPath();


    if (
        direction === 0
    ) {

        // 上

        ctx.moveTo(
            cx,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );

    }

    else if (
        direction === 1
    ) {

        // 右

        ctx.moveTo(
            cx + size,
            cy
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

    }

    else if (
        direction === 2
    ) {

        // 下

        ctx.moveTo(
            cx,
            cy + size
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

    }

    else {

        // 左

        ctx.moveTo(
            cx - size,
            cy
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );

    }


    ctx.closePath();

    ctx.fill();

}


// =====================================================
// 情報更新
// =====================================================

function updateInfo() {

    document.getElementById(
        "gapDisplay"
    ).textContent =
        gap;


    document.getElementById(
        "stepDisplay"
    ).textContent =
        stepCount.toLocaleString();


    document.getElementById(
        "cellSizeDisplay"
    ).textContent =
        CELL_SIZE;


    document.getElementById(
        "ant1Info"
    ).textContent =
        ant1InitialDirection === null
            ? "未設定"
            : DIRECTION_NAME[
                ant1InitialDirection
            ];


    document.getElementById(
        "ant2Info"
    ).textContent =
        ant2InitialDirection === null
            ? "未設定"
            : DIRECTION_NAME[
                ant2InitialDirection
            ];

}


// =====================================================
// アリ選択
// =====================================================

function selectAnt(index) {

    selectedAnt =
        index;


    document
        .getElementById(
            "ant1Button"
        )
        .classList
        .toggle(
            "active",
            index === 0
        );


    document
        .getElementById(
            "ant2Button"
        )
        .classList
        .toggle(
            "active",
            index === 1
        );


    document.getElementById(
        "selectedAntText"
    ).textContent =
        index === 0
            ? "🔴 アリ1を選択中"
            : "🔵 アリ2を選択中";


    focusOnAnt(
        index
    );

    draw();

}


// =====================================================
// 選択したアリへフォーカス
// =====================================================

function focusOnAnt(index) {

    if (
        ants.length !== 2
    ) {
        return;
    }


    const ant =
        ants[index];


    const wrapper =
        document.getElementById(
            "canvasWrapper"
        );


    const targetX =
        ant.x * CELL_SIZE;

    const targetY =
        ant.y * CELL_SIZE;


    wrapper.scrollLeft =
        Math.max(
            0,
            targetX -
            wrapper.clientWidth / 2 +
            CELL_SIZE / 2
        );


    wrapper.scrollTop =
        Math.max(
            0,
            targetY -
            wrapper.clientHeight / 2 +
            CELL_SIZE / 2
        );

}


// =====================================================
// 間隔を増やす
// =====================================================

function nextGap() {

    gap++;

    resetSimulation();

}


// =====================================================
// 間隔を減らす
// =====================================================

function previousGap() {

    if (
        gap <= 0
    ) {
        return;
    }


    gap--;

    resetSimulation();

}


// =====================================================
// アリ1の方向選択
// =====================================================

document
    .querySelectorAll(
        ".ant1-direction"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    ant1InitialDirection =
                        Number(
                            button.dataset.direction
                        );


                    /*
                     * アリ1を選択したら
                     * アリ2を選択可能にする
                     */

                    document
                        .querySelectorAll(
                            ".ant2-direction"
                        )
                        .forEach(
                            b => {
                                b.disabled = false;
                            }
                        );


                    document.getElementById(
                        "ant1DirectionStatus"
                    ).textContent =
                        "選択：" +
                        DIRECTION_NAME[
                            ant1InitialDirection
                        ];


                    document
                        .querySelectorAll(
                            ".ant1-direction"
                        )
                        .forEach(
                            b => {
                                b.classList
                                    .remove(
                                        "active"
                                    );
                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    /*
                     * アリ1を変更したら、
                     * アリ2の設定はそのまま維持
                     */

                    resetSimulation();

                }
            );

        }
    );


// =====================================================
// アリ2の方向選択
// =====================================================

document
    .querySelectorAll(
        ".ant2-direction"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (
                        ant1InitialDirection ===
                        null
                    ) {
                        return;
                    }


                    ant2InitialDirection =
                        Number(
                            button.dataset.direction
                        );


                    document.getElementById(
                        "ant2DirectionStatus"
                    ).textContent =
                        "選択：" +
                        DIRECTION_NAME[
                            ant2InitialDirection
                        ];


                    document
                        .querySelectorAll(
                            ".ant2-direction"
                        )
                        .forEach(
                            b => {
                                b.classList
                                    .remove(
                                        "active"
                                    );
                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    resetSimulation();

                }
            );

        }
    );


// =====================================================
// アリ1ボタン
// =====================================================

document
    .getElementById(
        "ant1Button"
    )
    .addEventListener(
        "click",
        () => {

            selectAnt(0);

        }
    );


// =====================================================
// アリ2ボタン
// =====================================================

document
    .getElementById(
        "ant2Button"
    )
    .addEventListener(
        "click",
        () => {

            selectAnt(1);

        }
    );


// =====================================================
// 1ステップ
// =====================================================

document
    .getElementById(
        "stepButton"
    )
    .addEventListener(
        "click",
        () => {

            stepSimulation();

            updateInfo();

            draw();

        }
    );


// =====================================================
// 自動再生
// =====================================================

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        toggleRunning
    );


// =====================================================
// リセット
// =====================================================

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        resetSimulation
    );


// =====================================================
// 間隔を増やす
// =====================================================

document
    .getElementById(
        "nextGapButton"
    )
    .addEventListener(
        "click",
        nextGap
    );


// =====================================================
// 間隔を減らす
// =====================================================

document
    .getElementById(
        "previousGapButton"
    )
    .addEventListener(
        "click",
        previousGap
    );


// =====================================================
// ズーム
// =====================================================

document
    .getElementById(
        "zoomSlider"
    )
    .addEventListener(
        "input",
        event => {

            CELL_SIZE =
                Number(
                    event.target.value
                );


            document.getElementById(
                "cellSizeDisplay"
            ).textContent =
                CELL_SIZE;


            updateCanvasSize();

            draw();


            if (
                selectedAnt !== null
            ) {

                focusOnAnt(
                    selectedAnt
                );

            }

        }
    );


// =====================================================
// 初期状態
// =====================================================

updateCanvasSize();

updateSpeedDisplay();

updateInfo();

draw();

</script>

</body>
</html>
