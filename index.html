<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ラングトンのアリ 2匹実験</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

.container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.header {
    flex-shrink: 0;
    padding: 12px 16px 8px;
    background: #f3f3f3;
}

h1 {
    margin: 0 0 10px;
    font-size: 24px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 14px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #444;
}

button.active {
    background: #555;
}

.info {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
    margin-top: 5px;
}

.speed-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
}

#speedSlider {
    width: min(600px, 60vw);
}

#speedValue {
    min-width: 190px;
    font-weight: bold;
    text-align: right;
}


/* ===============================
   実験エリア
   =============================== */

.experiment-area {
    flex: 1;
    min-height: 0;
    display: flex;
}


/* ===============================
   左側ズームバー
   =============================== */

.zoom-panel {
    width: 62px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #e7e7e7;
    border-right: 1px solid #ccc;
}

.zoom-title {
    writing-mode: vertical-rl;
    font-size: 12px;
    margin-bottom: 10px;
}

.zoom-slider {
    writing-mode: vertical-lr;
    direction: rtl;

    width: 28px;
    height: 300px;
}

.zoom-label {
    font-size: 11px;
    margin-top: 8px;
}


/* ===============================
   キャンバスエリア
   =============================== */

.canvas-wrapper {
    flex: 1;
    min-width: 0;
    min-height: 0;

    overflow: auto;
    background: white;

    position: relative;
}

canvas {
    display: block;
}

</style>

</head>

<body>

<div class="container">

    <!-- =================================
         上部操作
    ================================== -->

    <div class="header">

        <h1>🐜 ラングトンのアリ 2匹実験</h1>


        <div class="controls">

            <button id="stepButton">
                1ステップ進む
            </button>

            <button id="startButton">
                ▶ 自動再生
            </button>

            <button id="resetButton">
                ↻ リセット
            </button>

        </div>


        <div class="controls">

            <span><b>アリの間隔：</b></span>

            <button id="previousGapButton">
                ← 間隔を減らす
            </button>

            <button id="nextGapButton">
                間隔を増やす →
            </button>

        </div>


        <div class="controls">

            <span><b>並べ方：</b></span>

            <button
                id="horizontalButton"
                class="active">
                横
            </button>

            <button
                id="verticalButton">
                縦
            </button>

        </div>


        <div class="speed-box">

            <b>速度：</b>

            <input
                id="speedSlider"
                type="range"
                min="0"
                max="130"
                value="0"
                step="1"
            >

            <span id="speedValue">
                100 steps/s
            </span>

        </div>


        <div class="info">

            <div>
                開けたマス数：
                <strong id="gapDisplay">0</strong>
            </div>

            <div>
                ステップ数：
                <strong id="stepDisplay">0</strong>
            </div>

            <div>
                配置：
                <strong id="layoutDisplay">横</strong>
            </div>

            <div>
                マスサイズ：
                <strong id="cellSizeDisplay">8</strong> px
            </div>

        </div>

    </div>


    <!-- =================================
         実験画面
    ================================== -->

    <div class="experiment-area">


        <!-- =================================
             左端ズーム
        ================================== -->

        <div class="zoom-panel">

            <div class="zoom-title">
                🔍 拡大・縮小
            </div>

            <span class="zoom-label">
                大
            </span>

            <input
                id="zoomSlider"
                class="zoom-slider"
                type="range"
                min="2"
                max="24"
                step="1"
                value="8"
            >

            <span class="zoom-label">
                小
            </span>

        </div>


        <!-- =================================
             Canvas
        ================================== -->

        <div
            id="canvasWrapper"
            class="canvas-wrapper"
        >

            <canvas id="canvas"></canvas>

        </div>

    </div>

</div>


<script>


// =====================================================
// 基本設定
// =====================================================

// マスを大幅に増やす
const GRID_WIDTH = 500;
const GRID_HEIGHT = 350;


// 現在のマスサイズ
let CELL_SIZE = 8;


// Canvas
const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


// =====================================================
// 状態
// =====================================================

let blackCells = new Set();

let ants = [];

let gap = 0;

let stepCount = 0;

let layout = "horizontal";

let running = false;

let animationFrame = null;


// =====================================================
// 方向
// =====================================================

// 0 = 上
// 1 = 右
// 2 = 下
// 3 = 左

const DX = [
    0,
    1,
    0,
    -1
];

const DY = [
    -1,
    0,
    1,
    0
];


// =====================================================
// Canvasサイズ更新
// =====================================================

function updateCanvasSize() {

    canvas.width =
        GRID_WIDTH * CELL_SIZE;

    canvas.height =
        GRID_HEIGHT * CELL_SIZE;

}


// =====================================================
// マスのキー
// =====================================================

function cellKey(x, y) {

    return `${x},${y}`;

}


// =====================================================
// 速度
// =====================================================

const speedSlider =
    document.getElementById(
        "speedSlider"
    );


function getSpeed() {

    const value =
        Number(speedSlider.value);


    /*
     * 10^2 ～ 10^15
     */

    const exponent =
        2 +
        (value / 130) * 13;


    return Math.pow(
        10,
        exponent
    );

}


function formatSpeed(value) {

    if (value >= 1e15) {

        return "1,000,000,000,000,000";

    }

    return Math.round(
        value
    ).toLocaleString();

}


function updateSpeedDisplay() {

    const speed =
        getSpeed();

    document.getElementById(
        "speedValue"
    ).textContent =
        formatSpeed(speed) +
        " steps/s";

}


speedSlider.addEventListener(
    "input",
    updateSpeedDisplay
);


// =====================================================
// ズーム
// =====================================================

const zoomSlider =
    document.getElementById(
        "zoomSlider"
    );


zoomSlider.addEventListener(
    "input",
    () => {

        CELL_SIZE =
            Number(
                zoomSlider.value
            );

        document.getElementById(
            "cellSizeDisplay"
        ).textContent =
            CELL_SIZE;

        updateCanvasSize();

        draw();

    }
);


// =====================================================
// 初期化
// =====================================================

function resetSimulation() {

    blackCells.clear();

    stepCount = 0;


    const centerX =
        Math.floor(
            GRID_WIDTH / 2
        );

    const centerY =
        Math.floor(
            GRID_HEIGHT / 2
        );


    // =============================================
    // 横並び
    // =============================================

    if (
        layout === "horizontal"
    ) {

        ants = [

            {
                x:
                    centerX -
                    Math.floor(
                        (gap + 1) / 2
                    ),

                y:
                    centerY,

                direction: 0
            },

            {
                x:
                    centerX +
                    Math.ceil(
                        (gap + 1) / 2
                    ),

                y:
                    centerY,

                direction: 0
            }

        ];

    }


    // =============================================
    // 縦並び
    // =============================================

    else {

        ants = [

            {
                x:
                    centerX,

                y:
                    centerY -
                    Math.floor(
                        (gap + 1) / 2
                    ),

                direction: 0
            },

            {
                x:
                    centerX,

                y:
                    centerY +
                    Math.ceil(
                        (gap + 1) / 2
                    ),

                direction: 0
            }

        ];

    }


    updateInfo();

    draw();

}


// =====================================================
// 1ステップ
// =====================================================

function stepSimulation() {

    /*
     * 2匹を同時に処理する
     */

    const states =
        ants.map(
            ant => ({

                x: ant.x,

                y: ant.y,

                direction:
                    ant.direction,

                black:
                    blackCells.has(
                        cellKey(
                            ant.x,
                            ant.y
                        )
                    )

            })
        );


    // =============================================
    // 回転
    // =============================================

    states.forEach(
        (state, index) => {

            if (!state.black) {

                // 白 → 右

                ants[index].direction =
                    (
                        state.direction +
                        1
                    ) % 4;

            }

            else {

                // 黒 → 左

                ants[index].direction =
                    (
                        state.direction +
                        3
                    ) % 4;

            }

        }
    );


    // =============================================
    // マスを反転
    // =============================================

    states.forEach(
        state => {

            const key =
                cellKey(
                    state.x,
                    state.y
                );


            if (
                blackCells.has(key)
            ) {

                blackCells.delete(
                    key
                );

            }

            else {

                blackCells.add(
                    key
                );

            }

        }
    );


    // =============================================
    // 移動
    // =============================================

    ants.forEach(
        ant => {

            ant.x +=
                DX[
                    ant.direction
                ];

            ant.y +=
                DY[
                    ant.direction
                ];

        }
    );


    stepCount++;

}


// =====================================================
// 複数ステップ
// =====================================================

function runSteps(count) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        stepSimulation();

    }

}


// =====================================================
// 自動再生
// =====================================================

function animate() {

    if (!running) {
        return;
    }


    const speed =
        getSpeed();


    /*
     * 通常は60fpsなので、
     * 1フレームあたりの計算量を求める。
     */

    let steps =
        Math.floor(
            speed / 60
        );


    /*
     * 超巨大な速度でも
     * ブラウザが完全に固まらないようにする。
     */

    steps =
        Math.max(
            1,
            Math.min(
                steps,
                100000
            )
        );


    runSteps(
        steps
    );


    updateInfo();

    draw();


    animationFrame =
        requestAnimationFrame(
            animate
        );

}


// =====================================================
// 自動再生切替
// =====================================================

function toggleRunning() {

    running = !running;


    const button =
        document.getElementById(
            "startButton"
        );


    if (running) {

        button.textContent =
            "⏸ 停止";


        animationFrame =
            requestAnimationFrame(
                animate
            );

    }

    else {

        button.textContent =
            "▶ 自動再生";


        cancelAnimationFrame(
            animationFrame
        );

    }

}


// =====================================================
// 描画
// =====================================================

function draw() {

    updateCanvasSize();


    // =============================================
    // 背景
    // =============================================

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =============================================
    // グリッド
    // =============================================

    /*
     * 小さいマスの時は、
     * グリッドを薄くして見やすくする。
     */

    ctx.strokeStyle =
        CELL_SIZE <= 4
            ? "#f2f2f2"
            : "#e5e5e5";

    ctx.lineWidth = 1;


    /*
     * マスが小さすぎる場合、
     * 全ての線を描くと重くなるので
     * 一部だけ描く。
     */

    const gridStep =
        CELL_SIZE <= 4
            ? 5
            : 1;


    for (
        let x = 0;
        x <= GRID_WIDTH;
        x += gridStep
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x * CELL_SIZE,
            0
        );

        ctx.lineTo(
            x * CELL_SIZE,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y <= GRID_HEIGHT;
        y += gridStep
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * CELL_SIZE
        );

        ctx.lineTo(
            canvas.width,
            y * CELL_SIZE
        );

        ctx.stroke();

    }


    // =============================================
    // 黒マス
    // =============================================

    ctx.fillStyle =
        "#222";


    blackCells.forEach(
        key => {

            const [
                x,
                y
            ] =
                key
                    .split(",")
                    .map(Number);


            ctx.fillRect(

                x * CELL_SIZE,

                y * CELL_SIZE,

                CELL_SIZE,

                CELL_SIZE

            );

        }
    );


    // =============================================
    // アリ
    // =============================================

    ants.forEach(
        (ant, index) => {

            const x =
                ant.x * CELL_SIZE;

            const y =
                ant.y * CELL_SIZE;


            /*
             * 画面外なら描画しない
             */

            if (
                x + CELL_SIZE < 0 ||
                y + CELL_SIZE < 0 ||
                x > canvas.width ||
                y > canvas.height
            ) {

                return;

            }


            const cx =
                x +
                CELL_SIZE / 2;

            const cy =
                y +
                CELL_SIZE / 2;


            // ======================================
            // アリ本体
            // ======================================

            ctx.fillStyle =
                index === 0
                    ? "#e53935"
                    : "#1976d2";


            ctx.beginPath();

            ctx.arc(

                cx,

                cy,

                Math.max(
                    2,
                    CELL_SIZE * 0.42
                ),

                0,

                Math.PI * 2

            );

            ctx.fill();


            // ======================================
            // 向き
            // ======================================

            if (CELL_SIZE >= 5) {

                drawDirection(
                    cx,
                    cy,
                    ant.direction
                );

            }

        }
    );

}


// =====================================================
// アリの向き
// =====================================================

function drawDirection(
    cx,
    cy,
    direction
) {

    const size =
        CELL_SIZE * 0.25;


    ctx.fillStyle =
        "white";


    ctx.beginPath();


    if (
        direction === 0
    ) {

        // 上

        ctx.moveTo(
            cx,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );

    }

    else if (
        direction === 1
    ) {

        // 右

        ctx.moveTo(
            cx + size,
            cy
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx - size,
            cy + size
        );

    }

    else if (
        direction === 2
    ) {

        // 下

        ctx.moveTo(
            cx,
            cy + size
        );

        ctx.lineTo(
            cx - size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

    }

    else {

        // 左

        ctx.moveTo(
            cx - size,
            cy
        );

        ctx.lineTo(
            cx + size,
            cy - size
        );

        ctx.lineTo(
            cx + size,
            cy + size
        );

    }


    ctx.closePath();

    ctx.fill();

}


// =====================================================
// 情報更新
// =====================================================

function updateInfo() {

    document.getElementById(
        "gapDisplay"
    ).textContent =
        gap;


    document.getElementById(
        "stepDisplay"
    ).textContent =
        stepCount.toLocaleString();


    document.getElementById(
        "layoutDisplay"
    ).textContent =
        layout === "horizontal"
            ? "横"
            : "縦";

}


// =====================================================
// 間隔を増やす
// =====================================================

function nextGap() {

    gap++;

    resetSimulation();

}


// =====================================================
// 間隔を減らす
// =====================================================

function previousGap() {

    if (gap <= 0) {
        return;
    }

    gap--;

    resetSimulation();

}


// =====================================================
// 横
// =====================================================

document
    .getElementById(
        "horizontalButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                layout ===
                "horizontal"
            ) {
                return;
            }


            layout =
                "horizontal";


            document
                .getElementById(
                    "horizontalButton"
                )
                .classList
                .add("active");


            document
                .getElementById(
                    "verticalButton"
                )
                .classList
                .remove("active");


            resetSimulation();

        }
    );


// =====================================================
// 縦
// =====================================================

document
    .getElementById(
        "verticalButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                layout ===
                "vertical"
            ) {
                return;
            }


            layout =
                "vertical";


            document
                .getElementById(
                    "verticalButton"
                )
                .classList
                .add("active");


            document
                .getElementById(
                    "horizontalButton"
                )
                .classList
                .remove("active");


            resetSimulation();

        }
    );


// =====================================================
// ボタン
// =====================================================

document
    .getElementById(
        "stepButton"
    )
    .addEventListener(
        "click",
        () => {

            stepSimulation();

            updateInfo();

            draw();

        }
    );


document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        toggleRunning
    );


document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        resetSimulation
    );


document
    .getElementById(
        "nextGapButton"
    )
    .addEventListener(
        "click",
        nextGap
    );


document
    .getElementById(
        "previousGapButton"
    )
    .addEventListener(
        "click",
        previousGap
    );


// =====================================================
// 初期状態
// =====================================================

updateCanvasSize();

updateSpeedDisplay();

updateInfo();

draw();

resetSimulation();

</script>

</body>
</html>
